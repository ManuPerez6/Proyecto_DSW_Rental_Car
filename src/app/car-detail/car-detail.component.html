<div class="table-container">
  <div class="table-header">
    <h2>Detalles del Vehículo</h2>
    <button mat-raised-button color="primary" [routerLink]="['/cars', car?.id, 'edit']">
      <mat-icon>edit</mat-icon>
      Editar
    </button>
  </div>

  <mat-card *ngIf="car" class="detail-card mat-elevation-z4">
    <mat-card-header>
      <mat-card-title>{{ car.Marca }}</mat-card-title>
      <mat-card-subtitle>{{ car.Modelo }} - Año {{ car.Year }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-label">Color</span>
          <span class="stat-value">{{ car.Color }}</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Año</span>
          <span class="stat-value">{{ car.Year }}</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Precio</span>
          <span class="stat-value">{{ car.Precio | currency }}</span>
        </div>
      </div>

      <mat-divider class="divider"></mat-divider>

      <div class="items-section">
        <h3>Información del Vehículo</h3>
        <mat-chip-listbox>
          <mat-chip>Marca: {{ car.Marca }}</mat-chip>
          <mat-chip>Modelo: {{ car.Modelo }}</mat-chip>
          <mat-chip>Color: {{ car.Color }}</mat-chip>
        </mat-chip-listbox>
      </div>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-button (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
        Volver al listado
      </button>
      <button mat-button color="warn" (click)="deleteCar()">
        <mat-icon>delete</mat-icon>
        Eliminar
      </button>
    </mat-card-actions>
  </mat-card>

    <p>No se encontró el vehículo solicitado.</p>
  </div>

  <div *ngIf="loading" class="loading-shade">
    <mat-spinner></mat-spinner>
  </div>

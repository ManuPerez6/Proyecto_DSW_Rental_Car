
<div class="table-container">
  <div class="table-header">
    <h2>Inventario de Vehiculos</h2>
  </div>
  <div *ngIf="loading" class="loading-shade">
    <mat-spinner></mat-spinner>
  </div>

    <!-- problar -->
  <div *ngIf="!loading && dataSource.length > 0" class="mb-3">
  <p class="text-success fw-bold">
    Stock disponible: {{ dataSource.length }} vehículos
  </p>
</div>

  <div *ngIf="!loading && dataSource.length === 0" class="no-data">
    <p>No se encuentran registros. ¡Reserva tu Vehiculo!</p>
  </div>

  <!-- Cambios  -->
   <div class="container my-4">
  <div class="row text-center">
    <div class="col">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Marca </h5>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Modelo</h5>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Año</h5>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Color</h5>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Precio</h5>
        </div>
      </div>
    </div>
  </div>
</div>


  <table mat-table [dataSource]="dataSource" *ngIf="!loading && dataSource.length > 0" class="mat-elevation-z8">
    <!-- Columna Marca -->
    <ng-container matColumnDef="Marca">
      <th mat-header-cell *matHeaderCellDef>Marca</th>
      <td mat-cell *matCellDef="let auto">
        <a [routerLink]="['/auto', auto.id]" class="auto-name">
          {{ auto.marca }}
        </a>
      </td>
    </ng-container>

    <!-- Columna Modelo -->
    <ng-container matColumnDef="Modelo">
      <th mat-header-cell *matHeaderCellDef>Modelo</th>
      <td mat-cell *matCellDef="let auto">{{ auto.Modelo }}</td>
    </ng-container>

    <!-- Columna Año -->
    <ng-container matColumnDef="Año">
      <th mat-header-cell *matHeaderCellDef>Año</th>
      <td mat-cell *matCellDef="let auto">{{ auto.Anio }}</td>
    </ng-container>

    <!-- Columna Color -->
    <ng-container matColumnDef="Color">
      <th mat-header-cell *matHeaderCellDef>Color</th>
      <td mat-cell *matCellDef="let auto">
        <span class="stat-badge hp">{{ auto.Color }}</span>
      </td>
    </ng-container>

    <!-- Columna Precio -->
    <ng-container matColumnDef="Precio">
      <th mat-header-cell *matHeaderCellDef>Precio</th>
      <td mat-cell *matCellDef="let auto">
        <span class="stat-badge price">{{auto.Precio}}</span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <button mat-raised-button color="accent" routerLink="/character/new" class="add-button">
      <mat-icon>car_rental</mat-icon>
      <span>Nueva reserva</span>
    </button>
</div>
